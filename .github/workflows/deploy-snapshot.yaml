name: Deploy Snapshot

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-snapshot
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up JDK 21 (toolchain)
        if: matrix.java != '21'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk

      - name: Configure Maven toolchains
        if: matrix.java != '21'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_X64}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk${{ matrix.java }}-
            maven-${{ runner.os }}-

      - name: Build and verify
        # -Pexecute-tests: parent defaults to maven.test.skip=true; this profile re-enables unit + integration tests and
        #  the JaCoCo coverage check.
        # -Pformat: enforces Checkstyle from process-sources (fail on violation).
        run: ./mvnw -B -ntp -Pexecute-tests,format install

  deploy:
    name: Deploy to Nexus snapshots (JDK 21)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk21-
            maven-${{ runner.os }}-

      - name: Verify version is a SNAPSHOT
        run: |
          VERSION=$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$VERSION" in
            *-SNAPSHOT) echo "OK: deploying $VERSION" ;;
            *) echo "::error::main must carry a -SNAPSHOT version (found: $VERSION). Releases go through the v* tag flow."
               exit 1 ;;
          esac

      - name: Deploy
        env:
          NEXUS_MAVEN_USERNAME: ${{ secrets.NEXUS_MAVEN_USERNAME }}
          NEXUS_MAVEN_PASSWORD: ${{ secrets.NEXUS_MAVEN_PASSWORD }}
        # -Pdocumentation: attach sources and Javadoc jars so consumers can browse them from the snapshot repository as
        # well.
        run: ./mvnw -B -ntp -Pdocumentation deploy
