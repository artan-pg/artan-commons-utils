name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up JDK 21 (toolchain)
        if: matrix.java != '21'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
          set-default: false

      - name: Configure Maven toolchains
        if: matrix.java != '21'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_X64}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Cache Maven local repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk${{ matrix.java }}-
            maven-${{ runner.os }}-

      - name: Build and verify
        # -Pexecute-tests: parent defaults to maven.test.skip=true; this profile re-enables unit + integration tests and
        # the JaCoCo coverage check.
        # -Pformat: enforces Checkstyle from process-sources (fail on violation).
        run: ./mvnw -B -ntp -Pexecute-tests,format install
