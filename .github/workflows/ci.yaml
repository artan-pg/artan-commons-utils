name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk${{ matrix.java }}-
            maven-${{ runner.os }}-

      - name: Build and verify
        # -Pexecute-tests: parent defaults to maven.test.skip=true; this profile re-enables unit + integration tests and
        # the JaCoCo coverage check.
        # -Pformat: enforces Checkstyle from process-sources (fail on violation).
        run: ./mvnw -B -ntp -Pexecute-tests,format install
