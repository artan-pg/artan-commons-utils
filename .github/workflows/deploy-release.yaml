name: Deploy Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up JDK 21 (toolchain)
        if: matrix.java != '21'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
          set-default: false

      - name: Configure Maven toolchains
        if: matrix.java != '21'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_X64}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Cache Maven local repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk${{ matrix.java }}-
            maven-${{ runner.os }}-

      - name: Build and verify
        # -Pexecute-tests: parent defaults to maven.test.skip=true; this profile
        #   re-enables unit + integration tests and the JaCoCo coverage check.
        # -Pformat: enforces Checkstyle from process-sources (fail on violation).
        run: ./mvnw -B -ntp -Pexecute-tests,format install

  deploy:
    name: Deploy release to Nexus (JDK 21)
    needs: build
    if: >
      github.repository == 'artan-pg/artan-commons-utils' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk21-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk21-
            maven-${{ runner.os }}-

      - name: Read project version
        id: version
        run: |
          VERSION=$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "pom=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pom.xml version: $VERSION"

      - name: Verify tag matches version
        env:
          EXPECTED: ${{ steps.version.outputs.pom }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$EXPECTED" != "$TAG" ]; then
            echo "::error::Tag is v$TAG but pom.xml version is $EXPECTED. Refusing to deploy."
            exit 1
          fi
          case "$EXPECTED" in
            *-SNAPSHOT)
              echo "::error::SNAPSHOT version ($EXPECTED) cannot be released. Remove -SNAPSHOT before tagging."
              exit 1
              ;;
          esac
          echo "OK: tag v$TAG matches version $EXPECTED"

      - name: Deploy to Nexus releases
        env:
          NEXUS_MAVEN_USERNAME: ${{ secrets.NEXUS_MAVEN_USERNAME }}
          NEXUS_MAVEN_PASSWORD: ${{ secrets.NEXUS_MAVEN_PASSWORD }}
        # -Pdocumentation: attach sources and Javadoc jars to the release,
        #   as required for a public-facing library and by Maven Central rules.
        run: ./mvnw -B -ntp -Pdocumentation deploy
